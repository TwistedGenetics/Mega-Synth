name: Build plugin

on:
  push:
    branches: [ main, skin-rack ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (universal VST3 + AU + Standalone)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DMEGASYNTH_BUILD_NUMBER=${{ github.run_number }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Ad-hoc sign the bundles
        run: |
          cd "build/MegaSynth_artefacts/Release"
          codesign --force --deep --sign - "VST3/Mega Synth Rack.vst3"
          codesign --force --deep --sign - "AU/Mega Synth Rack.component"
          codesign --force --deep --sign - "Standalone/Mega Synth Rack.app"

      - name: Validate with pluginval
        continue-on-error: true
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 \
            --validate "build/MegaSynth_artefacts/Release/VST3/Mega Synth Rack.vst3"

      - name: Validate the Audio Unit (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/MegaSynth_artefacts/Release/AU/Mega Synth Rack.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu MgSy TwGn

      - name: Package
        run: |
          mkdir -p dist/MegaSynthRack-macOS
          cp -R "build/MegaSynth_artefacts/Release/VST3/Mega Synth Rack.vst3" dist/MegaSynthRack-macOS/
          cp -R "build/MegaSynth_artefacts/Release/AU/Mega Synth Rack.component" dist/MegaSynthRack-macOS/
          cp -R "build/MegaSynth_artefacts/Release/Standalone/Mega Synth Rack.app" dist/MegaSynthRack-macOS/
          cp INSTALL-mac.txt dist/MegaSynthRack-macOS/
          cd dist && ditto -c -k --keepParent MegaSynthRack-macOS MegaSynthRack-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MegaSynthRack-macOS
          path: dist/MegaSynthRack-macOS.zip

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/skin-rack'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rack-v0.1.${{ github.run_number }}
          name: Mega Synth Rack (test skin) v0.1.${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            Download **MegaSynthRack-macOS.zip** for Mac (VST3, AU and standalone app; universal for Apple Silicon and Intel).
            Install steps are in INSTALL-mac.txt inside the zip. MegaSynthRack-Windows.zip has the Windows VST3.
          files: dist/MegaSynthRack-macOS.zip

  windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64 -DMEGASYNTH_BUILD_NUMBER=${{ github.run_number }}

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # surface the compiler errors as annotations (readable without the full log)
            Select-String -Path build.log -Pattern "error C[0-9]+: |error LNK|fatal error" | ForEach-Object { ($_.Line -replace ' \[[^\]]*\]$', '').Trim() } | Sort-Object -Unique | Select-Object -First 40 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/MegaSynthRack-Windows | Out-Null
          Copy-Item -Recurse "build/MegaSynth_artefacts/Release/VST3/Mega Synth Rack.vst3" dist/MegaSynthRack-Windows/
          Copy-Item "build/MegaSynth_artefacts/Release/Standalone/Mega Synth Rack.exe" dist/MegaSynthRack-Windows/
          Compress-Archive -Path dist/MegaSynthRack-Windows -DestinationPath dist/MegaSynthRack-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MegaSynthRack-Windows
          path: dist/MegaSynthRack-Windows.zip

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/skin-rack'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rack-v0.1.${{ github.run_number }}
          name: Mega Synth Rack (test skin) v0.1.${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: dist/MegaSynthRack-Windows.zip
